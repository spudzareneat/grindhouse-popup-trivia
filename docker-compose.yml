services:
  generator:
    build: .
    image: grindhouse-popup-trivia
    # Built locally from this repo -- never pull it from a registry (Portainer "re-pull" would fail).
    pull_policy: build
    restart: unless-stopped
    # Cap the container log (every run logs a few hundred lines; the default driver never rotates).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Values come from the shell / a .env file next to this file (plain docker compose)
    # or from the stack's "Environment variables" (Portainer) -- no env_file needed.
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      GIT_REMOTE: ${GIT_REMOTE:-git@github.com:spudzareneat/grindhouse-popup-trivia.git}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-grindhouse-popup-trivia bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-bot@users.noreply.github.com}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
      MOVIE_DELAY_SEC: ${MOVIE_DELAY_SEC:-60}
      CLAUDE_TIMEOUT_MIN: ${CLAUDE_TIMEOUT_MIN:-30}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - work:/work
      # Absolute host path in Portainer (it builds from its own clone of the repo);
      # defaults to ./secrets/deploy_key for a plain `docker compose` checkout.
      - ${DEPLOY_KEY_PATH:-./secrets/deploy_key}:/secrets/deploy_key:ro
volumes:
  work:
